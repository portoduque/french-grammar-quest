name: Secure Vibe - Security

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-vibe-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout com histórico para Gitleaks
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks - secrets no histórico Git
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose

      - name: Setup Python para Semgrep CE
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check "semgrep>=1,<2"

      - name: Semgrep CE - SAST
        run: semgrep scan --config auto --error --metrics=off

      - name: Trivy - vulnerabilidades e misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: false
          exit-code: "1"
          format: "table"
