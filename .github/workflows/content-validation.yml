name: Validate content inventory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile scripts/validate_content.py
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Validate manifest and private Chapter 01 corpus
        run: |
          python scripts/validate_content.py
          python scripts/validate_content.py --private .
      - name: Verify Phase B Chapters 02–28 and reference coverage
        run: python scripts/validate_phase_b.py
