name: Validate content inventory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile scripts/validate_content.py scripts/validate_phase_b.py scripts/audit_phase_c.py scripts/validate_prd.py
      - name: Install JSON Schema validator
        run: |
          python -m pip install --only-binary :all: 'jsonschema==4.23.0'
      - name: Validate manifest and private Chapter 01 corpus
        run: |
          python scripts/validate_content.py
          python scripts/validate_content.py --private .
      - name: Verify Phase B Chapters 02–28 and reference coverage
        run: python scripts/validate_phase_b.py
      - name: Audit all chapters and supplementary references (Phase C)
        run: python scripts/audit_phase_c.py --check-report
      - name: Validate complete PRD and content crosswalk
        run: python scripts/validate_prd.py
